name: validate-public-portfolio

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  deterministic-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Python test runner
        run: python -m pip install pytest

      - name: Install FractalOS Python dependencies
        working-directory: 01_AIONE_FRACTALOS/source/fractalos
        run: python -m pip install -e .
      - name: Validate repository layout, Python syntax, links, and privacy markers
        run: python tools/validate_portfolio.py
      - name: Run AIONE Python suite
        working-directory: 01_AIONE_FRACTALOS/source/aione
        run: python -m pytest tests -q -p no:cacheprovider
      - name: Run FractalOS Python suite with explicit known expected failure
        working-directory: 01_AIONE_FRACTALOS/source/fractalos
        run: python -m pytest tests -q -p no:cacheprovider
      - name: Run selected AIONE Node.js suite
        run: node tools/run_aione_node_tests.mjs
      - name: Run ERA Binary reference-runtime tests
        working-directory: 01_AIONE_FRACTALOS/source/aione/forge-control/autonomy/era-binary
        run: python -m unittest discover -s tests -q
      - name: Run flow/recovery integration demo
        run: node --test 03_FLOW_RECOVERY_SYSTEM/flow_recovery_demo.test.mjs
      - name: Install and test curated Opti TypeScript slice
        working-directory: 05_REQUIREMENT_TO_SYSTEM_PIPELINE/source/opti
        run: |
          npm install --ignore-scripts
          npm test
